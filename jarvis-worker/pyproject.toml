[project]
name = "jarvis-worker"
version = "0.1.0"
description = "LangGraph Jarvis worker for Liljeblads property management"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "tenacity>=8.0",
  "google-auth>=2.0",
]

[project.scripts]
jarvis-ingest = "jarvis_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/jarvis_worker"]
