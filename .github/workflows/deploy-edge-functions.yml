# Deploy selected Supabase Edge Functions after push to main.
# One-time browser setup: GitHub → Settings → Secrets → Actions
#   SUPABASE_ACCESS_TOKEN  (from supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   (ojiswgqntenvbwtopxbu)

name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check edge risk modules match frontend
        run: npm run sync:edge-risk:check

      - name: Deploy jarvis-webhook
        run: supabase functions deploy jarvis-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy crewai-webhook (legacy alias)
        run: supabase functions deploy crewai-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ai-chat
        run: supabase functions deploy ai-chat --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
